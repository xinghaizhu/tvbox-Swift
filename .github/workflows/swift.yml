name: Build TVBox Swift iOS

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show project schemes
        run: xcodebuild -list -project tvbox.xcodeproj

      - name: Archive for real iPhone
        run: |
          xcodebuild archive \
            -project tvbox.xcodeproj \
            -scheme tvbox \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TVBox.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/TVBox.xcarchive/Products/Applications/TVBox.app"

          if [ ! -d "$APP" ]; then
            echo "TVBox.app not found in archive"
            find "$RUNNER_TEMP/TVBox.xcarchive/Products/Applications" -maxdepth 2 -print
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/TVBox-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-unsigned-iOS
          path: TVBox-unsigned.ipa
          if-no-files-found: error
